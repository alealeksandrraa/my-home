<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Home! — Spotlight 2</title><style>:root{--pink:#dc2783;--light:#fff0f7;--ink:#303044}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Arial,sans-serif;background:#fff8fc;color:var(--ink)}header{background:var(--light);padding:30px 20px}main{max-width:680px;margin:auto;padding:18px}h1{color:var(--pink);margin:0 0 8px;font-size:36px}h2{font-size:21px}.sub{color:#606070}.panel{background:white;border:1px solid #f1c7dc;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 4px 18px #eec6d733}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button{min-width:45px}.btn,button{border:1px solid #e6b3ce;background:#fff;color:#303044;border-radius:12px;padding:12px 15px;font-size:16px;cursor:pointer}.primary,.active{background:var(--pink);color:white;border-color:var(--pink)}.choice{display:block;width:100%;text-align:left;margin:7px 0}.choice.selected{background:#fbe0ef;border-color:var(--pink)}.field.correct{background:#e8f8ed;border:2px solid #229653;color:#126b38}.field.incorrect{background:#ffe8eb;border:2px solid #d72e4a;color:#92213a}.field{width:100%;padding:12px;border:1px solid #e6b3ce;border-radius:10px;font-size:17px;margin:5px 0 13px}.item{margin:18px 0}.muted{color:#76717b;font-size:14px}.feedback{font-weight:650;margin:15px 0;color:#8c2a62}.ok{color:#16814a}.bad{color:#ae3b4e}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.word{font-weight:700;font-size:20px}.hidden{display:none}.progress{height:8px;border-radius:20px;background:#f5dce9;overflow:hidden}.progress div{height:100%;background:var(--pink);transition:width .2s}.result{font-size:28px;color:var(--pink);font-weight:800}@media(max-width:500px){header{padding:22px 18px}main{padding:12px}.panel{padding:16px}h1{font-size:31px}}</style></head><body><header><div style="max-width:680px;margin:auto"><h1>🍊 My Home!</h1><div>Spotlight 2 · Готовимся к диктанту</div></div></header><main><p class="sub">4 небольших задания. Выполняй по порядку и нажимай «Проверить».</p><div class="progress"><div id="bar" style="width:20%"></div></div><div class="nav" id="nav"></div><section class="panel"><h2 id="heading"></h2><div id="task"></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="row"><button id="check" class="primary">Проверить</button><button id="next">Следующее задание →</button><button id="reset">Начать заново</button></div></section><p class="muted">Тренажёр работает прямо в браузере. Ответы не отправляются на сервер.</p></main><script>
const words=['tree house','chair','table','radio','bed'];
const ru=['домик на дереве','стул','стол','радио','кровать'];
const tasks=['Соедини слово с переводом','Вставь пропущенные буквы в слова и запиши их','Собери слова из букв','Переведи на английский'];
let step=0,answers=Array.from({length:4},()=>Array(5).fill('')),scores=Array(4).fill(null),checked=Array(4).fill(false);
const $=id=>document.getElementById(id);
const clean=s=>String(s).toLowerCase().trim().replace(/\s+/g,' ');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function correct(i){return step===0?answers[step][i]===String(i):clean(answers[step][i])===words[i]}
function nav(){ $('nav').innerHTML=tasks.map((_,i)=>`<button class="${i===step?'active':''}" onclick="go(${i})">${i+1}${scores[i]===5?' ✓':''}</button>`).join('') }
function mark(){document.querySelectorAll('[data-answer]').forEach(el=>{const i=Number(el.dataset.answer);el.classList.toggle('correct',checked[step]&&correct(i));el.classList.toggle('incorrect',checked[step]&&!correct(i))})}
function render(){
 $('check').classList.remove('hidden');$('next').classList.remove('hidden');
 $('heading').textContent=(step+1)+'. '+tasks[step];$('bar').style.width=((step+1)*25)+'%';nav();
 let html='';
 for(let i=0;i<5;i++){
  const prompt=step===0?words[i]:step===1?['tr__ h__se','ch__r','t__ble','r__dio','b__d'][i]:step===2?['o h u s e　t r e e','a h c i r','b a t l e','i o r a d','d e b'][i]:ru[i];
  html+=`<div class="item"><div class="word">${esc(prompt)}</div>`;
  if(step===0){html+=`<select data-answer="${i}" class="field" onchange="save(${i},this.value)"><option value="">Выбери перевод</option>${[2,3,4,0,1].map(k=>`<option value="${k}" ${answers[step][i]===String(k)?'selected':''}>${ru[k]}</option>`).join('')}</select>`}
  else{html+=`<input data-answer="${i}" class="field" type="text" autocomplete="off" spellcheck="false" placeholder="Напиши слово целиком" value="${esc(answers[step][i])}" oninput="save(${i},this.value)">`}
  html+='</div>';
 }
 $('task').innerHTML=html;
 $('feedback').textContent=checked[step]?`Правильно: ${scores[step]} из 5. ${scores[step]===5?'Отлично! 🎉':'Красным отмечены ошибки. Исправь и проверь ещё раз.'}`:'';
 $('feedback').className='feedback '+(scores[step]===5?'ok':'bad');
 $('next').textContent=step===3?'Посмотреть результат':'Следующее задание →';mark();
}
window.save=(i,v)=>{answers[step][i]=v;checked[step]=false;scores[step]=null;$('feedback').textContent='';document.querySelectorAll('[data-answer]').forEach(el=>el.classList.remove('correct','incorrect'));nav()};
window.go=i=>{step=i;render()};
$('check').onclick=()=>{checked[step]=true;scores[step]=words.filter((_,i)=>correct(i)).length;render()};
$('next').onclick=()=>{if(step<3){step++;render()}else{let done=scores.filter(x=>x!==null).length,total=scores.reduce((s,x)=>s+(x||0),0);$('heading').textContent='Твой результат 🍊';$('task').innerHTML=`<p class="result">${total} / 20</p><p>Проверено заданий: ${done} из 4.</p><p>${total===20?'Прекрасно! Ты готов к диктанту!':'Вернись к заданиям и исправь ошибки!'}</p>`;$('feedback').textContent='';$('check').classList.add('hidden');$('next').classList.add('hidden');$('bar').style.width='100%'}};
$('reset').onclick=()=>{step=0;answers=Array.from({length:4},()=>Array(5).fill(''));scores=Array(4).fill(null);checked=Array(4).fill(false);render()};render();
</script></body></html>
